<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D3B Studio · Refonte 7r, le moteur</title>
<style>
:root{
  --window:#09090b; --panel:#161619; --header:#1b1b1f; --raised:#232328; --recess:#111113; --input:#0e0e10;
  --hover:#2a2a30; --press:#33333a; --edge:rgba(255,255,255,.055); --edge2:rgba(255,255,255,.09);
  --text:#cfd0d5; --bright:#f4f4f6; --muted:#8e9099; --dim:#5f616a;
  --accent:#3b82f6; --accent-soft:rgba(59,130,246,.18); --accent-edge:rgba(59,130,246,.5);
  --play:#3ecf5c; --warn:#e9ad3c; --err:#ea5d52; --route:#5fd3c0; --zone:#a3d47b;
  --c-harvest:#9ad46b; --c-fight:#ff9a8f; --c-door:#e9ad3c; --c-npc:#7fa7ff; --c-exit:#c9a7f2; --c-zaap:#5fd3c0; --c-bag:#e9ad3c; --c-wait:#8e9099;
  --r:7px; --rp:10px; --gap:5px; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--window);color:var(--text);font:12.5px/1.45 Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
input{font:inherit;color:var(--bright);background:none;border:0;outline:0;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:var(--r)}
i.ic{display:inline-flex;width:16px;height:16px;flex:none}
i.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
i.ic.f svg{fill:currentColor;stroke:none}
kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;font:500 10.5px Inter,sans-serif;color:var(--muted);background:var(--raised);border-radius:4px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.4)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:8px}

.app{display:grid;grid-template-rows:42px minmax(0,1fr) 26px;height:100vh;background:radial-gradient(1200px 400px at 50% -200px,rgba(59,130,246,.06),transparent 70%),var(--window)}
.title{display:grid;grid-template-columns:1fr minmax(0,340px) 1fr;align-items:center;gap:12px;padding-left:10px}
.title .l{display:flex;align-items:center;gap:2px}
.logo{width:22px;height:22px;border-radius:6px;margin-right:8px;background:linear-gradient(135deg,#3ecf5c,#1f7a3a);display:grid;place-items:center;font:700 9px Inter;color:#04130a}
.menu button{height:26px;padding:0 9px;border-radius:6px;color:var(--muted)}
.menu button:hover{background:var(--hover);color:var(--bright)}
.find{height:28px;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;border-radius:8px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--edge);color:var(--dim)}
.find span{flex:1}
.title .r{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding-right:10px}
.pie{display:flex;align-items:center;gap:2px;height:32px;padding:2px;border-radius:11px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--edge);transition:box-shadow .2s}
.pie.playing{box-shadow:inset 0 0 0 1px rgba(62,207,92,.5),0 0 18px -6px rgba(62,207,92,.45)}
.who{height:28px;min-width:190px;display:flex;align-items:center;gap:8px;padding:0 6px 0 3px;border-radius:9px}
.who:hover{background:var(--hover)}
.who .t{flex:1;line-height:1.15;color:var(--bright)}
.who .t small{display:block;color:var(--muted);font-size:11px}
.who.p .t small{color:#7fe596}
.ib{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--text)}
.ib:hover{background:var(--hover);color:var(--bright)}
.ib.go{color:var(--play)}.ib.st{color:var(--err)}
.av{position:relative;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:600 10px Inter;color:#fff;flex:none}
.av .d{position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 2px var(--panel)}
.av .d.play{background:var(--play)}

.docks{display:grid;grid-template-columns:262px minmax(0,1fr) 308px;gap:var(--gap);padding:0 var(--gap);min-height:0}
.dock{background:var(--panel);border-radius:var(--rp);box-shadow:inset 0 0 0 1px var(--edge);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;overflow:hidden}
.dock.pieon{box-shadow:inset 0 0 0 1.5px rgba(62,207,92,.55)}
.colL{display:grid;grid-template-rows:minmax(0,1.15fr) minmax(0,1fr);gap:var(--gap);min-height:0}
.colC{display:grid;grid-template-rows:minmax(0,1fr) var(--bh,196px);gap:var(--gap);min-height:0}
.strip{height:36px;flex:none;display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--edge)}
.ptab{height:26px;display:flex;align-items:center;gap:7px;padding:0 6px 0 9px;border-radius:6px;color:var(--muted);white-space:nowrap}
.ptab i.ic{width:14px;height:14px}
.ptab:hover{background:var(--hover);color:var(--text)}
.ptab.on{background:var(--raised);color:var(--bright)}
.ptab .x{opacity:.45;width:14px;height:14px}
.strip .grow{flex:1}
.pbody{flex:1;min-height:0;overflow:auto}
.sbar{display:flex;gap:6px;padding:8px 8px 4px}
.sbar .s{flex:1;height:26px;display:flex;align-items:center;gap:7px;padding:0 9px;background:var(--input);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--edge);color:var(--dim)}
.btn{height:28px;padding:0 11px;border-radius:var(--r);display:inline-flex;align-items:center;gap:6px;background:var(--raised);color:var(--text);transition:background .12s;white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--bright)}
.btn.pri{background:var(--accent);color:#fff;font-weight:500}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--edge2)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}

.tr{display:flex;align-items:center;gap:6px;height:26px;margin:0 6px;padding:0 6px;border-radius:6px;color:var(--text);white-space:nowrap;position:relative}
.tr:hover{background:var(--hover)}
.tr.sel{background:var(--accent-soft);color:var(--bright)}
.tr.multi{background:rgba(59,130,246,.12);color:var(--bright)}
.tr i.ic{width:14px;height:14px}
.tr .car{width:12px;height:12px;opacity:.5;transition:transform .12s}
.tr .car.cl{transform:rotate(-90deg)}
.tr .sp{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px}
.tr .eye{opacity:.35}.tr:hover .eye{opacity:.8}
.tr .pp{display:none;color:var(--play)}.tr:hover .pp{display:inline-flex}
.tr small{color:var(--dim);font-size:11px}
.tr.live small{color:#7fe596}
.grp{display:flex;align-items:center;gap:6px;padding:9px 12px 3px;color:var(--dim);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.grp .n{margin-left:auto;letter-spacing:0}
.dots{display:inline-flex;gap:2px}
.dots i{width:6px;height:6px;border-radius:50%}
.k-route{color:var(--route)}.k-zone{color:var(--zone)}.k-prof{color:#c9a7f2}.k-seq{color:#7fa7ff}

.vp{position:relative;flex:1;min-height:0;background:#0c1a1c;overflow:hidden}
.vp canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.glass{position:absolute;display:flex;align-items:center;gap:3px;padding:3px;background:rgba(22,22,25,.88);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),0 8px 24px rgba(0,0,0,.4);border-radius:11px}
.tl{height:26px;padding:0 9px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;color:var(--text);white-space:nowrap}
.tl:hover{background:var(--hover);color:var(--bright)}
.tl.on{background:var(--accent-soft);color:var(--bright)}
.tl.rec{color:#ff8a80}
.tl i.ic{width:14px;height:14px}
.tl kbd{background:transparent;box-shadow:none;height:14px;min-width:0;padding:0 2px;font-size:10px;color:var(--dim)}
.vs{width:1px;height:16px;background:var(--edge2);margin:0 3px}
.hud{position:absolute;left:12px;bottom:12px;padding:5px 10px;border-radius:9px;background:rgba(14,14,16,.78);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);color:var(--muted);pointer-events:none}
.pieflag{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:5px 12px;border-radius:9px;background:rgba(14,30,18,.9);box-shadow:inset 0 0 0 1px rgba(62,207,92,.5);color:#7fe596;pointer-events:none}
.pieflag.on{display:flex}
.legend{position:absolute;right:12px;bottom:12px;display:flex;gap:14px;padding:5px 10px;border-radius:9px;background:rgba(14,14,16,.78);color:var(--muted);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);pointer-events:none}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.sec{padding:12px;border-bottom:1px solid var(--edge)}
.sec h4{margin:0 0 9px;font-size:12px;font-weight:600;color:var(--bright);display:flex;align-items:center;gap:7px}
.sec h4 small{font-weight:400;color:var(--dim)}
.ihead{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--edge)}
.ihead .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ihead b{display:block;color:var(--bright);font-size:13px}
.ihead small{color:var(--muted)}
.kv{display:grid;grid-template-columns:92px 1fr;gap:7px 8px;align-items:center}
.kv>span{color:var(--dim)}
.kv .v{min-height:26px;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:6px;background:var(--header);color:var(--text)}
.kv .v.plain{background:none;padding:0}
.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.fig b{display:block;font-size:16px;color:var(--bright);font-weight:600}
.fig small{color:var(--dim);font-size:10.5px}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--input);box-shadow:inset 0 0 0 1px var(--edge)}
.seg button{height:24px;padding:0 10px;border-radius:6px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--raised);color:var(--bright)}
.hint{color:var(--dim);font-size:11.5px;line-height:1.5}
.tok{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:var(--raised);color:var(--bright);box-shadow:inset 0 0 0 1px var(--edge2);vertical-align:middle;margin:0 1px}
.tok:hover{background:var(--hover)}
.tok i.ic{width:12px;height:12px}
.cb{width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;background:var(--input);box-shadow:inset 0 0 0 1px var(--edge2);flex:none;color:#fff}
.cb.on{background:var(--accent);box-shadow:none}
.cb i.ic{width:11px;height:11px;display:none}.cb.on i.ic{display:inline-flex}
.act{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;row-gap:2px;align-items:start;padding:7px 6px 7px 10px;border-radius:9px;background:var(--header);box-shadow:inset 0 0 0 1px var(--edge);margin-bottom:6px}
.act .meta{grid-column:2;display:flex;gap:8px;align-items:center;padding-bottom:2px}
.act>i.ic{width:15px;height:15px;margin-top:5px}
.act .s{min-width:0;line-height:26px}
.act .s b{color:var(--bright);font-weight:600}
.act .cov{color:var(--dim);font-size:11px;white-space:nowrap}
.act .cov.var{color:var(--warn)}
.act .rm{opacity:.45;width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.act .rm:hover{opacity:1;background:var(--hover)}
.act.inh{background:transparent;opacity:.75}
.act.comp{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0}
.act.comp .ch{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border-bottom:1px solid var(--edge)}
.act.comp .ch i.ic{margin-top:0}
.act.comp .ch b{flex:1;font-weight:600}
.act.comp .cbd{padding:6px 10px 9px;line-height:26px}
.c-harvest{color:var(--c-harvest)}.c-fight{color:var(--c-fight)}.c-door{color:var(--c-door)}.c-npc{color:var(--c-npc)}.c-exit{color:var(--c-exit)}.c-zaap{color:var(--c-zaap)}.c-bag{color:var(--c-bag)}.c-wait{color:var(--c-wait)}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.pop{position:fixed;z-index:80;display:none;min-width:270px;padding:6px;border-radius:12px;background:#1d1d21;box-shadow:inset 0 0 0 1px var(--edge2),0 16px 40px rgba(0,0,0,.55);animation:in .14s var(--ease)}
.pop.show{display:block}
.pop h5{margin:6px 8px 4px;font-size:11px;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.popi{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;width:100%;text-align:left}
.popi:hover{background:var(--hover);color:var(--bright)}
.popi small{display:block;color:var(--dim);font-size:11px}
.popi .ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--raised);flex:none}
.pal2{display:grid;grid-template-columns:1fr 1fr;gap:2px;min-width:380px}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.sq{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.sqs{flex:1;overflow:auto;position:relative}
.sqrow{display:grid;grid-template-columns:130px 1fr;min-height:30px;border-bottom:1px solid var(--edge)}
.sqh{display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--text);border-right:1px solid var(--edge);background:var(--header)}
.sqh i.ic{width:14px;height:14px}
.sqh .sp{margin-left:auto;display:flex;gap:2px;opacity:.5}
.sqg{display:grid;grid-template-columns:repeat(var(--n,8),1fr);position:relative;min-width:600px}
.sqg .cell{border-right:1px solid var(--edge);min-height:30px}
.sqg .cell:hover,.sqg .cell.hi{background:rgba(59,130,246,.09)}
.sqg .cell.sel{background:rgba(59,130,246,.16)}
.sqg.ruler .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:3px 0}
.sqg.ruler .cell b{color:var(--bright);font-weight:600;font-size:11.5px}
.sqg.ruler .cell small{color:var(--dim);font-size:10px}
.sqg.ruler .cell.cur b{color:#7fe596}
.clip{position:absolute;top:3px;bottom:3px;border-radius:7px;display:flex;align-items:center;gap:6px;padding:0 10px;overflow:hidden;white-space:nowrap;color:#0a0e0b;font-weight:500;z-index:2;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.clip i.ic{width:13px;height:13px;flex:none}
.clip.sel{box-shadow:0 0 0 1.5px var(--accent),inset 0 0 0 1px rgba(255,255,255,.3)}
.clip .hd{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.clip .hd.l{left:0}.clip .hd.r{right:0}
.clip .hd:hover{background:rgba(0,0,0,.25)}
.k-harvest{background:#8fc65a}.k-fight{background:#f08f84}.k-door{background:#e3b04e}.k-npc{background:#7fa7ff}.k-exit{background:#c9a7f2}.k-zaap{background:#5fd3c0}.k-bag{background:#e3b04e}.k-wait{background:#9a9ca6}
.mv{position:absolute;top:3px;bottom:3px;border-radius:6px;background:rgba(95,211,192,.14);box-shadow:inset 0 0 0 1px rgba(95,211,192,.35);color:var(--route);display:flex;align-items:center;justify-content:center;font-size:11px;pointer-events:none}
.phead{position:absolute;top:0;bottom:0;width:2px;background:var(--play);z-index:5;pointer-events:none;box-shadow:0 0 8px rgba(62,207,92,.7)}
.sqtool{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--edge);color:var(--dim)}
.sqtool .grow{flex:1}
.jr{display:flex;gap:10px;align-items:center;height:26px;padding:0 12px;color:var(--text);white-space:nowrap}
.jr time{color:var(--dim)}

.ae{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px}
.ae .main{overflow:auto;padding:0 0 24px;position:relative}
.ae .side{border-left:1px solid var(--edge);display:flex;flex-direction:column;background:var(--recess)}
.aehead{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--edge)}
.aehead .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.aehead .nm{font-size:16px;font-weight:600;color:var(--bright)}
.aehead .grow{flex:1}
.cat{border-bottom:1px solid var(--edge)}
.cath{display:flex;align-items:center;gap:8px;padding:11px 16px;color:var(--bright);font-weight:600}
.cath i.ic{width:12px;height:12px;opacity:.6}
.cath .grow{flex:1}
.cath .advb{font-weight:400;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.cath .advb:hover{color:var(--bright)}
.prop{display:grid;grid-template-columns:190px 1fr;align-items:center;gap:10px;padding:4px 16px;min-height:34px}
.prop>label{color:var(--muted);display:flex;align-items:center;gap:6px}
.prop .rs{color:var(--warn);width:13px;height:13px}
.prop.chg>label{color:var(--bright)}
.prop.chg{box-shadow:inset 2px 0 0 var(--accent)}
.fld{display:flex;align-items:center;gap:8px;min-height:28px;flex-wrap:wrap}
.fld .sl{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.1);position:relative;max-width:240px}
.fld .sl i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent)}
.fld .sl u{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.resrow{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 6px 0 8px;border-radius:7px;background:var(--header);box-shadow:inset 0 0 0 1px var(--edge)}
.resrow .sw{width:14px;height:14px;border-radius:50%}
.advpane{display:none;background:rgba(255,255,255,.015);padding-bottom:6px}
.cat.open .advpane{display:block}
.cat.open .advb i.ic{transform:rotate(180deg)}
.pmap{flex:1;min-height:0;position:relative;background:#0c1a1c}
.pmap canvas{position:absolute;inset:0;width:100%;height:100%}
.pfig{padding:12px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--edge)}

.status{display:flex;align-items:center;gap:18px;padding:0 14px;color:var(--muted);justify-content:flex-end;font-size:12px}
.status span{display:flex;align-items:center;gap:6px}
.status i.d{width:7px;height:7px;border-radius:50%;background:var(--play)}
.nav{position:fixed;left:8px;bottom:2px;height:22px;z-index:90;display:flex;gap:2px;align-items:center}
.nav button{height:22px;padding:0 9px;border-radius:7px;color:var(--muted);display:flex;align-items:center;gap:6px;font-size:11.5px;background:rgba(255,255,255,.05)}
.nav button:hover{color:var(--bright);background:var(--hover)}
.nav button.on{background:var(--accent);color:#fff}
.nav button.v.on{background:#e9ad3c;color:#1a1204;font-weight:600}
.nav button kbd{height:14px;min-width:14px;font-size:9.5px;background:rgba(255,255,255,.12);color:inherit;box-shadow:none}
.nav .sp{width:1px;height:12px;margin:0 4px;background:var(--edge2)}
.nav .lab{color:var(--dim);padding:0 4px;font-size:11px}
.toast{position:fixed;right:20px;bottom:40px;z-index:95;padding:10px 14px;border-radius:11px;background:#1d1d21;box-shadow:inset 0 0 0 1px rgba(62,207,92,.4),0 12px 30px rgba(0,0,0,.5);color:var(--bright);display:none;align-items:center;gap:10px}
.toast.show{display:flex;animation:in .2s var(--ease)}
body.notes [data-note]{outline:1.5px dashed rgba(233,173,60,.75);outline-offset:-2px;position:relative}
body.notes [data-note]::after{content:attr(data-note);position:absolute;right:8px;top:6px;z-index:50;max-width:280px;padding:5px 9px;border-radius:7px;background:#e9ad3c;color:#1a1204;font:600 11px/1.35 Inter,sans-serif;white-space:normal;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div class="app">
  <div class="title">
    <div class="l"><div class="logo">D3B</div><div class="menu"><button>Fichier</button><button>Édition</button><button>Fenêtre</button><button>Aide</button></div></div>
    <div class="find"><i class="ic" data-i="search"></i><span>Chercher partout</span><kbd>Ctrl K</kbd></div>
    <div class="r">

function selRow(type,ids){return S.sel.type===type&&ids.every(i=>S.sel.ids.includes(i))}
function renderOutliner(){
  let h=`<div class="grp">${ic('map')}Monde des Douze</div><div class="grp" style="padding-top:5px">Personnages<span class="n">2 en ligne</span></div>`;
  CH.forEach(c=>{const on=selRow('char',[c.id]);h+=`<div class="tr${on?' sel':''}${c.st==='play'?' live':''}" ${c.st==='off'?'style="opacity:.5"':''} data-sel="char:${c.id}"><span class="av" style="width:18px;height:18px;border-radius:5px;font-size:8px;background:${c.col}">${c.ini}<i class="d ${c.st==='play'?'play':''}" style="width:7px;height:7px;box-shadow:0 0 0 1.5px #161619"></i></span>${c.n}<span class="sp">${c.st==='play'?`<small>étape ${S.cur+1}/8</small>`:''}${c.st==='off'?'':`<span class="pp" data-pp="${c.id}">${ic('play','f')}</span>`}${ic('eye','eye')}</span></div>`});
  h+=`<div class="grp">Trajets<span class="n">2</span></div>`;
  h+=`<div class="tr${selRow('route',['r'])?' sel':''}" data-sel="route:r">${ic('chev',`car ${S.expanded?'':'cl'}`)}${ic('route','k-route')}Bûcheron d'Astrub<span class="sp">${N()}${ic('eye','eye')}</span></div>`;
  if(S.expanded)ST.forEach((s,i)=>{const[x,y]=coord(s.x,s.y);const on=stagesSel().includes(i);
    const ts=cover(i).map(c=>`<i style="background:${DOT[c.t]}"></i>`).join('');
    h+=`<div class="tr${on?(stagesSel().length>1?' multi':' sel'):''}" style="padding-left:34px" data-stage="${i}"><span style="color:var(--route);font:600 10px Inter;width:12px">${i+1}</span>${x}, ${y}<small>${s.z}</small><span class="sp"><span class="dots">${ts}</span></span></div>`});
  h+=`<div class="tr" data-sel="none"><span style="width:12px"></span>${ic('route','k-route')}Sud<span class="sp">4${ic('eye','eye')}</span></div>`;
  h+=`<div class="grp">Zones<span class="n">1</span></div><div class="tr${selRow('zone',['z'])?' sel':''}" data-sel="zone:z">${ic('map','k-zone')}Forêt d'Astrub<span class="sp">5 cartes${ic('eye','eye')}</span></div>`;
  $('outliner').innerHTML=h;icons($('outliner'))}
function renderContent(){
  const row=(i,c,n,extra,attr,st)=>`<div class="tr" ${attr||''} ${st?`style="${st}"`:''}>${ic(i,c)}${n}<span class="sp">${extra||''}</span></div>`;
  $('content').innerHTML=`<div class="grp">${ic('folder')}Profils</div>`+row('sliders','k-prof','Frêne et châtaignier','','data-openprof="frene"')+row('sliders','k-prof','Chasse aux larves')+
  `<div class="grp">Trajets</div>`+row('route','k-route',"Bûcheron d'Astrub",'dans le monde')+row('route','k-route','Sud','dans le monde')+
  `<div class="grp">Zones</div>`+row('map','k-zone',"Forêt d'Astrub",'dans le monde')+
  `<div class="grp">Séquences</div>`+row('flow','k-seq','Tournée bois puis banque')+
  `<div class="grp">${ic('lock')}Fournis avec D3B<span class="n">7</span></div>`+['Récolte automatique','Bûcheron auto','Mineur auto'].map(n=>row('sliders','k-prof',n,'','','opacity:.65')).join('');icons($('content'))}

/* ───────── détails : selon la sélection, selon la variante ───────── */
const sentence=c=>({harvest:`<b>Récolter</b> <span class="tok">${ic('leaf')}${c.txt}</span>`,fight:`<b>Combattre</b> <span class="tok">${c.txt}</span>`,door:`<b>Prendre la porte</b> de la <span class="tok">${c.txt}</span>`,npc:`<b>Parler</b> au <span class="tok">${c.txt}</span>`,exit:`<b>Sortie forcée</b> <span class="tok">${c.txt}</span>`,zaap:`<b>Prendre le zaap</b> <span class="tok">${c.txt}</span>`,bag:`<b>Havre-sac</b>`,wait:`<b>Attendre</b> <span class="tok">${c.txt}</span>`}[c.t]);
const rangeTxt=c=>c.a===0&&c.b===N()-1?'toutes les étapes':c.a===c.b?'étape '+(c.a+1):'étapes '+(c.a+1)+' à '+(c.b+1);
const head=(ico,color,t,sub)=>`<div class="ihead"><span class="ico" style="background:${color}">${ico}</span><div><b>${t}</b><small>${sub}</small></div></div>`;
const secRoute=()=>`<div class="sec"><h4>Trajet</h4><div class="kv"><span>Parcours</span><div class="v plain"><div class="seg"><button class="on">Boucle</button><button>Simple</button><button>Aller-retour</button></div></div><span>Carte sans chemin</span><div class="v plain"><div class="seg"><button class="on">Passer</button><button>Échouer</button></div></div></div><div class="figs"><div class="fig"><b>${N()}</b><small>étapes</small></div><div class="fig"><b>${N()}</b><small>cartes</small></div><div class="fig"><b>${CLIPS.length}</b><small>actions</small></div><div class="fig"><b>0</b><small>trous</small></div></div></div>`;
function stageProps(i){const s=ST[i],[x,y]=coord(s.x,s.y);return `<div class="sec"><h4>Étape ${i+1}</h4><div class="kv"><span>Carte</span><div class="v">${x}, ${y}</div><span>Zone</span><div class="v">${s.z}</div><span>Épinglée</span><div class="v plain"><span class="cb${i===0?' on':''}">${ic('check')}</span></div></div></div>`}
function actRow(c,sel){const n=sel.length,covered=sel.filter(i=>c.a<=i&&i<=c.b).length,all=covered===n,m=ACT[c.t];
  return `<div class="act"><i class="ic c-${c.t}"><svg viewBox="0 0 16 16">${P[m[0]]}</svg></i><div class="s">${sentence(c)}</div><button class="rm" data-rmclip="${c.id}" title="Retirer">${ic('x')}</button><div class="meta">${n>1?`<span class="cov${all?'':' var'}">${all?'Sur les '+n+' étapes':'Sur '+covered+' des '+n+' étapes'}</span>`:`<span class="cov">${rangeTxt(c)}</span>`}${!all&&n>1?`<button class="btn sm ghost" data-clipall="${c.id}">Pour toutes</button>`:''}</div></div>`}
function compCard(c,inh){const m=ACT[c.t];return `<div class="act comp${inh?' inh':''}"><div class="ch"><span class="cb on">${ic('check')}</span><i class="ic c-${c.t}"><svg viewBox="0 0 16 16">${P[m[0]]}</svg></i><b>${m[1]}</b>${inh?`<span class="cov">hérité du trajet</span>`:`<button class="rm" data-rmclip="${c.id}" title="Retirer">${ic('x')}</button>`}</div><div class="cbd">${sentence(c)}</div></div>`}
function renderDetails(){const el=$('details'),sel=S.sel,V=S.variant;let h='';const full=c=>c.a===0&&c.b===N()-1;
  if(sel.type==='char'){const c=chBy(sel.ids[0]),p=c.prof&&PROF[c.prof];
    h=head(`<span class="av" style="width:34px;height:34px;border-radius:10px;font-size:12px;background:${c.col}">${c.ini}</span>`,'transparent',c.n,`${c.cls} · niveau ${c.lvl}`)+
    `<div class="sec"><h4>Comportement</h4><div class="kv"><span>Profil</span><div class="v" style="justify-content:space-between"><span style="display:flex;gap:6px;align-items:center">${p?ic(p.ico,'k-prof')+p.n:'Aucun'}</span>${ic('chev')}</div><span>Au démarrage</span><div class="v plain"><span class="cb">${ic('check')}</span></div></div>
     <div class="addrow" style="margin-top:10px"><button class="btn ghost" data-openprof="frene">${ic('link')}Ouvrir le profil</button><button class="btn ghost">${ic('plus')}Nouveau profil</button></div></div>
     <div class="sec"><h4>État</h4><div class="kv"><span>Carte</span><div class="v">${coord(c.x,c.y).join(', ')}</div><span>Vie</span><div class="v plain">${c.id==='ay'?'78 %':'100 %'}</div><span>Pods</span><div class="v plain">${c.id==='ay'?'41 %':'12 %'}</div></div></div>
     <div class="sec"><h4>Compte</h4><div class="kv"><span>Abonnement</span><div class="v plain">Abonné</div></div></div>`}
  else if(sel.type==='zone'){h=head(ic('map','k-zone'),'#1f2b14',"Forêt d'Astrub",'Zone · 5 cartes')+
    `<div class="sec"><h4>Contenu</h4><div class="kv"><span>Sous-zones</span><div class="v"><span class="tok">Forêt</span></div><span>Cartes en plus</span><div class="v plain">0</div><span>Cartes exclues</span><div class="v plain">0</div></div><div class="hint" style="margin-top:10px">Outil Zone (Z) : cliquez ou peignez des cartes dans la vue pour les ajouter, Alt pour les retirer.</div></div>
     <div class="sec"><h4>Utilisée par</h4><div class="tr" style="margin:0 -6px">${ic('sliders','k-prof')}Frêne et châtaignier</div></div>`}
  else if(sel.type==='route'||sel.type==='stages'){
    const ids=sel.type==='stages'?sel.ids:[],n=ids.length;
    h=sel.type==='route'?head(ic('route','k-route'),'#12302b',"Bûcheron d'Astrub",`Trajet · ${N()} étapes`)+secRoute():head(ic('route','k-route'),'#12302b',n>1?n+' étapes':'Étape '+(ids[0]+1),n>1?'Sélection multiple · '+ids.map(i=>i+1).join(', '):coord(ST[ids[0]].x,ST[ids[0]].y).join(', ')+' · '+ST[ids[0]].z);
    if(V==='A'){
      if(sel.type==='route'){const all=CLIPS.filter(full);h+=`<div class="sec"><h4>Sur chaque étape<small>par défaut</small></h4>${all.map(c=>actRow(c,ST.map((_,i)=>i))).join('')||'<div class="hint" style="margin-bottom:8px">Aucune. Ce qu\'on met ici est fait sur chaque carte du trajet.</div>'}<button class="btn" data-add="all">${ic('plus')}Ajouter une action</button><div class="hint" style="margin-top:10px">Pour des étapes précises : encadrez-les dans la vue, ou Maj+clic dans l'Outliner.</div></div>`}
      else{const rel=CLIPS.filter(c=>ids.some(i=>c.a<=i&&i<=c.b));
        h+=`<div class="sec" data-note="Variante A · comme Unreal : on encadre plusieurs étapes, le panneau règle les mêmes champs pour toutes. « varie » dit celles qui diffèrent."><h4>Actions<small>${n>1?'sur la sélection':'de cette étape'}</small></h4>${rel.map(c=>actRow(c,ids)).join('')||'<div class="hint" style="margin-bottom:8px">Aucune action.</div>'}<div class="addrow"><button class="btn" data-add="sel">${ic('plus')}Ajouter ${n>1?'aux '+n+' étapes':'une action'}</button>${n>1?`<button class="btn ghost" id="copyFirst">${ic('copy')}Copier celles de l'étape ${ids[0]+1}</button>`:''}</div></div>`+(n===1?stageProps(ids[0]):'')}}
    else if(V==='B'){if(!S.clip)h+=`<div class="sec"><div class="hint">${sel.type==='route'?'Les actions se règlent dans le séquenceur, en bas : une piste par action, un clip sur les étapes concernées.':'Ces étapes sont choisies : tracez un clip sur leurs colonnes, dans une piste du séquenceur.'}</div></div>`+(n===1?stageProps(ids[0]):'')}
    else{const rel=CLIPS.filter(c=>sel.type==='route'||ids.some(i=>c.a<=i&&i<=c.b)),inh=rel.filter(full),own=sel.type==='route'?[]:rel.filter(c=>!full(c));
      h+=`<div class="sec" data-note="Variante C · comme Unity : des composants sur un objet. Ce qui est sur le trajet vaut pour toutes ses étapes ; une étape ajoute les siens."><h4>Composants${sel.type==='route'?`<small>valent pour les ${N()} étapes</small>`:''}</h4>${own.map(c=>compCard(c,false)).join('')}${inh.map(c=>compCard(c,sel.type==='stages')).join('')}<button class="btn" data-add="${sel.type==='route'?'all':'sel'}">${ic('plus')}Ajouter un composant</button></div>`+(n===1?stageProps(ids[0]):'')}}
  if(V==='B'&&S.clip&&(sel.type==='route'||sel.type==='stages')){const c=CLIPS.find(c=>c.id===S.clip);if(c){const m=ACT[c.t];
    h=head(`<i class="ic c-${c.t}" style="width:18px;height:18px"><svg viewBox="0 0 16 16">${P[m[0]]}</svg></i>`,'#232328',m[1],'Clip · '+rangeTxt(c))+`<div class="sec"><h4>Action</h4><div class="act" style="margin-bottom:0"><div class="s">${sentence(c)}</div></div></div><div class="sec"><h4>Étapes</h4><div class="kv"><span>De l'étape</span><div class="v">${c.a+1}</div><span>À l'étape</span><div class="v">${c.b+1}</div></div><div class="addrow" style="margin-top:10px"><button class="btn ghost" data-clipall="${c.id}">${ic('fit')}Étendre à tout le trajet</button><button class="btn ghost" data-rmclip="${c.id}">${ic('x')}Supprimer</button></div></div>`+secRoute()}}
  el.innerHTML=h;icons(el)}

/* ───────── panneau du bas ───────── */
const BT=()=>S.variant==='B'?['seq','journal','trace','problems']:['journal','trace','problems','stats'];
const BL={seq:['Séquenceur','flow'],journal:['Journal','comp'],trace:['Trace','route'],problems:['Problèmes','dots'],stats:['Statistiques','layers']};
function renderBottom(){const tabs=BT();if(!tabs.includes(S.btab))S.btab=tabs[0];
  $('btabs').innerHTML=tabs.map(k=>`<button class="ptab${S.btab===k?' on':''}" data-bt="${k}">${ic(BL[k][1])}${BL[k][0]}</button>`).join('')+'<span class="grow"></span>';icons($('btabs'));
  $('colC').style.setProperty('--bh',S.btab==='seq'?'292px':'176px');const b=$('bbody');
  if(S.btab==='seq'){b.innerHTML=renderSeq();icons(b);playhead()}
  else{const av=(c,i)=>`<span class="av" style="width:16px;height:16px;border-radius:5px;font-size:7px;background:${c}">${i}</span>`;b.innerHTML=`<div class="jr"><time>10:42:08</time>${av('#3b82f6','AY')}Ayuwoki · étape ${S.cur+1} · ${cover(S.cur).map(c=>ACT[c.t][1]).join(' + ')||'déplacement'}</div><div class="jr"><time>10:41:52</time>${av('#3b82f6','AY')}Récolte · Frêne ×6</div><div class="jr"><time>10:41:31</time>${av('#3b82f6','AY')}Combat gagné · 3 larves</div><div class="jr"><time>10:41:02</time>${av('#d65db1','NO')}Connectée</div>`}}
function renderSeq(){const n=N();
  let h=`<div class="sq" data-note="Variante B · le séquenceur : une piste par action, un clip posé sur les étapes. On règle une fois sur toute la plage, et la tête de lecture verte suit le personnage."><div class="sqtool"><b style="color:var(--bright);font-weight:600">Bûcheron d'Astrub</b><span>${n} étapes</span><span class="grow"></span><span>Tracez sur une piste pour poser un clip · étirez ses bords · Maj+glisser pour copier</span><button class="btn sm ghost" data-add="track">${ic('plus')}Piste</button></div><div class="sqs">`;
  h+=`<div class="sqrow" style="position:sticky;top:0;z-index:4;background:var(--panel)"><div class="sqh" style="color:var(--dim)">Étapes</div><div class="sqg ruler" style="--n:${n}">${ST.map((s,i)=>{const[x,y]=coord(s.x,s.y);return `<div class="cell${S.run&&i===S.cur?' cur':''}" data-col="${i}"><b>${i+1}</b><small>${x},${y}</small></div>`}).join('')}</div></div>`;
  h+=`<div class="sqrow"><div class="sqh">${ic('route','k-route')}Déplacement<span class="sp">${ic('lock')}</span></div><div class="sqg" style="--n:${n}">${ST.map((s,i)=>`<div class="cell" data-col="${i}"></div>`).join('')}${ST.map((s,i)=>`<div class="mv" style="left:calc(${i}/${n}*100% + 3px);width:calc(100%/${n} - 6px)">${s.z}</div>`).join('')}</div></div>`;
  S.tracks.forEach(t=>{const m=ACT[t];h+=`<div class="sqrow"><div class="sqh"><i class="ic c-${t}"><svg viewBox="0 0 16 16">${P[m[0]]}</svg></i>${SH[t]}<span class="sp">${ic('eye')}${ic('lock')}</span></div><div class="sqg" style="--n:${n}">${ST.map((s,i)=>`<div class="cell" data-col="${i}" data-t="${t}"></div>`).join('')}${CLIPS.filter(c=>c.t===t).map(c=>`<div class="clip k-${t}${S.clip===c.id?' sel':''}" data-clip="${c.id}" style="left:calc(${c.a}/${n}*100% + 2px);width:calc(${c.b-c.a+1}/${n}*100% - 4px)"><span class="hd l" data-hd="l"></span>${ic(m[0])}${c.b>c.a?c.txt:''}<span class="hd r" data-hd="r"></span></div>`).join('')}</div></div>`});
  h+=`<div class="sqrow" style="border:0"><div class="sqh" style="color:var(--dim)" data-add="track">${ic('plus')}Ajouter une piste</div><div class="sqg" style="--n:${n};min-height:30px"></div></div><div class="phead" id="phead" style="display:none"></div></div></div>`;return h}
function playhead(){const ph=$('phead');if(!ph)return;if(!S.run){ph.style.display='none';return}const g=document.querySelector('.sqg.ruler');if(!g)return;const sc=g.closest('.sqs'),gr=g.getBoundingClientRect(),sr=sc.getBoundingClientRect();
  ph.style.display='block';ph.style.left=(gr.left-sr.left+sc.scrollLeft+((S.pos+.5)%N())/N()*gr.width)+'px'}

  const cat=(id,t,body,advBody,n)=>`<div class="cat${adv[id]?' open':''}" id="cat-${id}"><div class="cath">${ic('chev')}${t}<span class="grow"></span>${advBody?`<button class="advb" data-adv="${id}">Avancé · ${n}${ic('chev')}</button>`:''}</div>${body}${advBody?`<div class="advpane">${advBody}</div>`:''}</div>`;
  $('sc-prof').innerHTML=`<div class="ae"><div class="main" data-note="Un éditeur d'asset comme Unreal : catégories, réglages rares sous « Avancé » dans chacune, barre bleue et flèche sur ce qui change du modèle. La carte à droite sert à choisir le lieu.">
   <div class="aehead"><span class="ico" style="background:#241d33">${ic('sliders','k-prof')}</span><div><div class="nm">Frêne et châtaignier</div><div style="color:var(--muted)">Profil · basé sur Récolte · <span style="color:var(--warn)">4 réglages changés</span></div></div><span class="grow"></span><button class="btn ghost">${ic('play','f')} Jouer avec Nolwenn</button><button class="btn pri">Enregistrer</button></div>
   ${cat('what','Quoi',prop('Ressources',`<div class="seg"><button>Par métier</button><button class="on">Liste</button></div>`)+prop('Liste',`<span class="resrow"><span class="sw" style="background:#8fc65a"></span>Frêne ${ic('x')}</span><span class="resrow"><span class="sw" style="background:#a0693c"></span>Châtaignier ${ic('x')}</span><button class="btn sm ghost">${ic('plus')}Ajouter</button>`,true),prop('Ordre sur la carte',`<span class="tok">Plus proche d'abord</span>`)+prop('Exclure',`<span class="hint">Aucune</span>`),2)}
   ${cat('where','Où',prop('Lieu',`<div class="seg"><button>Automatique</button><button class="on">Choisi</button></div>`,true)+prop('Zone',`<span class="tok">${ic('map','k-zone')}Forêt d'Astrub</span><button class="btn sm ghost">Choisir sur la carte</button>`,true),prop('Sous-zones en rotation',`<span class="tok">10</span>`)+prop('Rester sous mon niveau',`<span class="cb on">${ic('check')}</span>`)+prop('Cartes isolées',`<span class="cb">${ic('check')}</span>`)+prop('Zaap si on économise',`<span class="tok">5 cartes</span>`),4)}
   ${cat('bank','Banque',prop('Pods pleins à',sl(90))+prop('Déposer',`<div class="seg"><button class="on">La récolte</button><button>Tout sauf l'équipement</button></div>`),prop('Coffre',`<div class="seg"><button class="on">Son coffre en banque</button><button>Coffre de guilde</button></div>`),1)}
   ${cat('heal','Soins et combats',prop('Se soigner sous',`<span class="cb on">${ic('check')}</span>`+sl(50),true)+prop("L'IA joue les combats",`<span class="cb on">${ic('check')}</span>`)+prop('Ouvrir les sacs de ressources',`<span class="cb">${ic('check')}</span>`),prop('Nourriture',`<span class="hint">Ce que l'inventaire contient</span>`)+prop('Après un combat',`<span class="tok">Reprendre</span>`)+prop('Après un combat perdu',`<span class="tok">Reprendre</span>`),3)}
  </div><div class="side"><div class="pmap"><canvas id="cvp"></canvas></div><div class="pfig"><div class="fig"><b>5</b><small>cartes</small></div><div class="fig"><b>~11</b><small>ressources / tour</small></div><div class="fig"><b>3 min</b><small>par tour</small></div></div></div></div>`;icons($('sc-prof'))}

/* ───────── état de l'interface ───────── */
function renderTabs(){$('tabs').innerHTML=`<button class="ptab${S.tab==='world'?' on':''}" data-tab="world">${ic('map')}Monde${ic('x','x')}</button>`+(S.profOpen?`<button class="ptab${S.tab==='prof'?' on':''}" data-tab="prof">${ic('sliders','k-prof')}Frêne et châtaignier${ic('x','x')}</button>`:'')+'<span class="grow"></span>';icons($('tabs'))}
function renderPie(){const c=chBy(S.pieChar),p=c.prof&&PROF[c.prof],pl=c.st==='play';

function renderAll(){renderOutliner();renderContent();renderDetails();renderBottom();renderPie();renderTabs();drawWorld()}
function setSel(type,ids){S.sel={type,ids};if(type!=='stages'&&type!=='route')S.clip=null;renderAll()}
function showTab(t){S.tab=t;$('sc-world').style.display=t==='world'?'flex':'none';$('sc-prof').style.display=t==='prof'?'flex':'none';renderTabs();renderPie();requestAnimationFrame(drawAll)}
function setTool(t){S.tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));$('vp').style.cursor=t==='sel'?'default':'crosshair'}
let tt;function toast(t){const e=$('toast');e.innerHTML=ic('check')+t;icons(e);e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1800)}
let sim=null;
function setRun(on){const c=chBy('ay');c.st=on?'play':'stop';S.run=on;clearInterval(sim);
  if(on)sim=setInterval(()=>{S.pos=(S.pos+.03)%N();const k=Math.floor(S.pos);if(k!==S.cur){S.cur=k;if(k===0)S.lap++;renderOutliner();renderPie();if(S.btab!=='seq')renderBottom()}drawWorld();playhead()},60);renderAll()}
function addClip(t,txt,a,b){CLIPS.push({id:++CID,t,a,b,txt:txt||ACT[t][3]});if(!S.tracks.includes(t))S.tracks.push(t)}
function addToSel(t){const ids=stagesSel();ids.length?runsOf(ids).forEach(([a,b])=>addClip(t,'',a,b)):addClip(t,'',0,N()-1)}
function pal(anchor,mode){const pop=$('pop'),r=anchor.getBoundingClientRect();
  pop.innerHTML=`<h5>${mode==='all'?'Sur chaque étape':mode==='track'?'Nouvelle piste':mode==='sel'?'Ajouter à la sélection':'Ajouter'}</h5><div class="pal2">${Object.keys(ACT).map(k=>`<button class="popi" data-pick="${k}" data-mode="${mode}"><span class="ico c-${k}">${ic(ACT[k][0])}</span><span>${ACT[k][1]}<small>${ACT[k][2]}</small></span></button>`).join('')}</div>`;
  pop.classList.add('show');icons(pop);const w=pop.offsetWidth,h=pop.offsetHeight;pop.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';pop.style.top=(r.top-h-6<8?r.bottom+6:r.top-h-6)+'px'}
function pick(t,mode){if(mode==='track'){if(!S.tracks.includes(t))S.tracks.push(t)}else if(mode==='all')addClip(t,'',0,N()-1);else addToSel(t);$('pop').classList.remove('show');toast(ACT[t][1]+' ajouté');renderAll()}

document.addEventListener('click',e=>{const t=e.target,q=s=>t.closest(s);let b;
  if(!q('#pop')&&!q('[data-add]')&&!q('#addBtn'))$('pop').classList.remove('show');
  if(b=q('[data-pick]')){pick(b.dataset.pick,b.dataset.mode);return}
  if(b=q('[data-add]')){e.stopPropagation();pal(b,b.dataset.add);return}
  if(q('#addBtn')){const pop=$('pop'),r=q('#addBtn').getBoundingClientRect();pop.innerHTML=`<h5>Ajouter au projet</h5>`+[['sliders','Profil',"Ce qu'un personnage joue"],['route','Trajet','Tracé sur la carte du monde'],['map','Zone','Cartes et sous-zones'],['flow','Séquence','Plusieurs profils à la suite'],['folder','Dossier','']].map(a=>`<button class="popi"><span class="ico">${ic(a[0])}</span><span>${a[1]}<small>${a[2]}</small></span></button>`).join('');pop.classList.add('show');icons(pop);pop.style.left=r.left+'px';pop.style.top=(r.bottom+4)+'px';e.stopPropagation();return}
  if(b=q('[data-pp]')){e.stopPropagation();const c=chBy(b.dataset.pp);if(c.id==='ay')setRun(true);else{c.st='play';renderAll()}return}
  if(b=q('[data-stage]')){const i=+b.dataset.stage;let ids=stagesSel();if(e.shiftKey){ids=ids.includes(i)?ids.filter(x=>x!==i):[...ids,i]}else ids=[i];if(!ids.length)ids=[i];S.sel={type:'stages',ids:ids.sort((a,b)=>a-b)};S.clip=null;renderAll();return}
  if(q('.tr .car')){S.expanded=!S.expanded;renderOutliner();return}
  if(b=q('[data-sel]')){const[ty,id]=b.dataset.sel.split(':');if(ty==='none')return;setSel(ty,[id]);if(ty==='route'){S.expanded=true;renderOutliner()}return}
  if(b=q('[data-openprof]')){S.profOpen=true;renderProf();showTab('prof');return}
  if(b=q('[data-tab]')){showTab(b.dataset.tab);return}
  if(b=q('[data-bt]')){S.btab=b.dataset.bt;renderBottom();return}
  if(b=q('[data-tool]')){setTool(b.dataset.tool);if(b.dataset.tool==='rec')toast("Enregistrement : jouez, les étapes et leurs actions se créent seules (7d4b)");return}
  if(b=q('[data-rmclip]')){const id=+b.dataset.rmclip;CLIPS=CLIPS.filter(c=>c.id!==id);if(S.clip===id)S.clip=null;renderAll();return}
  if(b=q('[data-clipall]')){const c=CLIPS.find(c=>c.id===+b.dataset.clipall);if(S.clip===c.id||!stagesSel().length){c.a=0;c.b=N()-1}else{stagesSel().forEach(i=>{c.a=Math.min(c.a,i);c.b=Math.max(c.b,i)})}renderAll();return}
  if(q('#copyFirst')){const ids=stagesSel(),f=ids[0];CLIPS.filter(c=>c.a<=f&&f<=c.b&&!(c.a===0&&c.b===N()-1)).forEach(c=>ids.slice(1).forEach(i=>addClip(c.t,c.txt,i,i)));toast('Actions copiées');renderAll();return}
  if(b=q('[data-adv]')){const id=b.dataset.adv;S.advOpen[id]=!S.advOpen[id];$('cat-'+id).classList.toggle('open',!!S.advOpen[id]);return}
  if(q('#piePlay')){const c=chBy(S.pieChar);if(c.id==='ay')setRun(true);else{c.st='play';renderAll()}return}
  if(q('#piePause')||q('#pieStop')){setRun(false);return}
  if(b=q('[data-go]')){go(b.dataset.go);return}
  if(b=q('[data-var]')){S.variant=b.dataset.var;S.clip=null;go(S.scene);return}
  if(q('#noteBtn')){S.notes=!S.notes;document.body.classList.toggle('notes',S.notes);buildNav();return}
});
(function(){const vp=$('vp');let drag=null;
  const pos=e=>{const r=$('cv').getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  const cellAt=(x,y)=>{const v=window.VW;return[Math.floor((x-v.ox)/v.k),Math.floor((y-v.oy)/v.k)]};
  vp.addEventListener('mousedown',e=>{if(e.target.closest('.glass'))return;const[x,y]=pos(e);const n=HIT.nodes.find(h=>Math.hypot(h[0]-x,h[1]-y)<12),ch=HIT.chars.find(h=>Math.hypot(h[0]-x,h[1]-y)<14);
    if(S.tool==='route'){const[a,b]=cellAt(x,y);if(land[b]&&land[b][a]&&!n){ST.push({x:a,y:b,z:ZN[zone[b][a]][0]});S.sel={type:'stages',ids:[ST.length-1]};renderAll();toast('Étape '+ST.length+' ajoutée')}return}
    if(S.tool==='zone'){const[a,b]=cellAt(x,y);if(land[b]&&land[b][a]){const z=zone[b][a];e.altKey?S.zones.delete(z):S.zones.add(z);S.sel={type:'zone',ids:['z']};renderAll()}return}
    if(n){let ids=stagesSel();ids=e.shiftKey?(ids.includes(n[2])?ids.filter(i=>i!==n[2]):[...ids,n[2]]):[n[2]];if(!ids.length)ids=[n[2]];S.sel={type:'stages',ids:ids.sort((a,b)=>a-b)};S.clip=null;renderAll();return}
    if(ch){setSel('char',[ch[2]]);return}
    drag={x0:x,y0:y,x,y,moved:false}});
  window.addEventListener('mousemove',e=>{const[x,y]=pos(e);
    if(drag){drag.x=x;drag.y=y;if(Math.hypot(x-drag.x0,y-drag.y0)>4)drag.moved=true;if(drag.moved){drawWorld();const g=window.VW.g;g.save();g.scale(window.VW.d,window.VW.d);g.fillStyle='rgba(59,130,246,.12)';g.strokeStyle='rgba(59,130,246,.8)';g.lineWidth=1;g.fillRect(drag.x0,drag.y0,x-drag.x0,y-drag.y0);g.strokeRect(drag.x0,drag.y0,x-drag.x0,y-drag.y0);g.restore()}return}
    if(!vp.contains(e.target)||!window.VW)return;const[a,b]=cellAt(x,y);const ok=land[b]&&land[b][a];const si=ST.findIndex(s=>s.x===a&&s.y===b);const[X,Y]=coord(a,b);
    $('hud').textContent=!ok?'Survolez une carte':si>=0?`Étape ${si+1} · ${X}, ${Y} · ${ST[si].z}${cover(si).length?' · '+cover(si).map(c=>ACT[c.t][1]).join(', '):''}`:`${X}, ${Y} · ${ZN[zone[b][a]][0]}`});
  window.addEventListener('mouseup',()=>{if(!drag)return;const d=drag;drag=null;
    if(d.moved){const xa=Math.min(d.x0,d.x),xb=Math.max(d.x0,d.x),ya=Math.min(d.y0,d.y),yb=Math.max(d.y0,d.y);const ids=HIT.nodes.filter(h=>h[0]>=xa&&h[0]<=xb&&h[1]>=ya&&h[1]<=yb).map(h=>h[2]);if(ids.length){S.sel={type:'stages',ids:ids.sort((a,b)=>a-b)};S.clip=null;renderAll();toast(ids.length+' étapes choisies')}else drawWorld()}
    else{const[a,b]=cellAt(d.x0,d.y0);const inR=ST.some(s=>s.x===a&&s.y===b),inZ=land[b]&&land[b][a]&&S.zones.has(zone[b][a]);if(inR)setSel('route',['r']);else if(inZ)setSel('zone',['z']);else setSel('none',[])}})})();
(function(){const b=$('bbody');let st=null;
  const colOf=(g,e)=>{const r=g.getBoundingClientRect();return Math.max(0,Math.min(N()-1,Math.floor((e.clientX-r.left)/r.width*N())))};
  b.addEventListener('mousedown',e=>{if(S.btab!=='seq')return;const hd=e.target.closest('.hd'),clip=e.target.closest('.clip'),cell=e.target.closest('.cell[data-t]');
    if(clip){const id=+clip.dataset.clip,c=CLIPS.find(c=>c.id===id);S.clip=id;if(S.sel.type!=='route'&&S.sel.type!=='stages')S.sel={type:'route',ids:['r']};
      if(hd){st={mode:hd.dataset.hd,c,g:clip.closest('.sqg')}}else if(e.shiftKey){const k=colOf(clip.closest('.sqg'),e),w=c.b-c.a,a=Math.min(k,N()-1-w);addClip(c.t,c.txt,a,a+w);toast('Clip copié')}
      renderDetails();if(!st){renderBottom();renderOutliner();drawWorld()}else b.querySelectorAll('.clip').forEach(x=>x.classList.toggle('sel',+x.dataset.clip===id));e.preventDefault();return}
    if(cell){const g=cell.closest('.sqg'),k=colOf(g,e);st={mode:'new',t:cell.dataset.t,a:k,b:k,g};S.clip=null;e.preventDefault()}});
  window.addEventListener('mousemove',e=>{
    const cl=e.target.closest&&e.target.closest('#bbody [data-col]');const hi=cl?+cl.dataset.col:null;if(hi!==S.hi){S.hi=hi;if(!st)drawWorld();b.querySelectorAll('.cell.hi').forEach(x=>x.classList.remove('hi'));if(hi!==null)b.querySelectorAll('.cell[data-col="'+hi+'"]').forEach(x=>x.classList.add('hi'))}
    if(!st)return;const k=colOf(st.g,e);
    if(st.mode==='l'){st.c.a=Math.min(k,st.c.b)}else if(st.mode==='r'){st.c.b=Math.max(k,st.c.a)}else{st.b=k}
    if(st.mode==='new'){const a=Math.min(st.a,st.b),z=Math.max(st.a,st.b);st.g.querySelectorAll('.cell').forEach(x=>{const i=+x.dataset.col;x.classList.toggle('sel',i>=a&&i<=z)})}
    else{const id=st.c.id;renderBottom();drawWorld();b.querySelectorAll('.clip').forEach(x=>x.classList.toggle('sel',+x.dataset.clip===id))}});
  window.addEventListener('mouseup',()=>{if(!st)return;const s=st;st=null;if(s.mode==='new'){const a=Math.min(s.a,s.b),z=Math.max(s.a,s.b);addClip(s.t,'',a,z);S.clip=CLIPS[CLIPS.length-1].id;toast(ACT[s.t][1]+' · étape'+(z>a?'s '+(a+1)+' à '+(z+1):' '+(a+1)));if(S.sel.type!=='route'&&S.sel.type!=='stages')S.sel={type:'route',ids:['r']}}renderAll()})})();
$('bbody').addEventListener('scroll',()=>playhead(),true);

const SC=[['world','Monde'],['route','Trajet'],['prof','Profil'],['zone','Zone']];
function buildNav(){$('nav').innerHTML=SC.map((n,i)=>`<button data-go="${n[0]}" class="${S.scene===n[0]?'on':''}"><kbd>${i+1}</kbd>${n[1]}</button>`).join('')+'<span class="sp"></span><span class="lab">Régler les étapes</span>'+['A','B','C'].map(v=>`<button class="v ${S.variant===v?'on':''}" data-var="${v}"><kbd>${v}</kbd>${{A:'Détails',B:'Séquenceur',C:'Composants'}[v]}</button>`).join('')+`<span class="sp"></span><button id="noteBtn" class="${S.notes?'v on':''}"><kbd>N</kbd>Annotations</button>`}
function go(sc){S.scene=sc;
  if(sc==='world'){S.sel={type:'char',ids:['ay']};S.clip=null;S.btab='journal';showTab('world');setTool('sel');if(!S.run)setRun(true)}
  if(sc==='route'){S.sel={type:'stages',ids:[2,3,4]};S.clip=null;S.btab=S.variant==='B'?'seq':'journal';showTab('world');setTool('sel')}
  if(sc==='prof'){S.profOpen=true;renderProf();showTab('prof');S.sel={type:'char',ids:['no']}}
  if(sc==='zone'){S.sel={type:'zone',ids:['z']};S.btab='journal';showTab('world');setTool('zone')}
  buildNav();renderAll();requestAnimationFrame(()=>{drawAll();playhead()})}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase(),n=+k;
  if(n>=1&&n<=4)go(SC[n-1][0]);else if(['a','b','c'].includes(k)){S.variant=k.toUpperCase();S.clip=null;go(S.scene)}else if(k==='n'){S.notes=!S.notes;document.body.classList.toggle('notes',S.notes);buildNav()}else if(k==='v')setTool('sel');else if(k==='t')setTool('route');else if(k==='z')setTool('zone');else if(k==='r')setTool('rec');else if(k==='escape')$('pop').classList.remove('show')});
addEventListener('resize',()=>{drawAll();playhead()});
icons();renderProf();
(function(){const h=(location.hash||'#world').slice(1).split('-');if(['A','B','C'].includes((h[1]||'').toUpperCase()))S.variant=h[1].toUpperCase();if(h[2]==='notes'){S.notes=true;document.body.classList.add('notes')}
  setRun(true);go(SC.some(s=>s[0]===h[0])?h[0]:'world')})();
</script>

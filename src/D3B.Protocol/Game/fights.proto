// A fight: how it starts, where its fighters are placed, its turns, and how it ends. Measured on 3.7.12.12's captures
// of 11 fights, 9 the player's attacks and 2 resources' protectors', with a Xelor and a Steamer, by structure, timing,
// and values compared on the machine, never written down (D178). The client sends by itself what follows the server's
// events: it acknowledges the character's sequences, and says it is ready for each turn, as it confirms a walk out of
// fights (D60).
syntax = "proto3";

package d3b.game;

import "Game/actors.proto";
import "Readable/options.proto";

option csharp_namespace = "D3B.Protocol.Game";

// Attacks a group of monsters: the client sends it once its walk reached the group's cell, within 1 ms of the walk's
// confirmation, 61 times in the same read. Measured on the player's 98 attacks the 80 game connections captured: 94 walks
// ended on the group's cell, and twice, back on the map after a fight, the character stood on a group's cell and attacked
// without walking. Twice the group walked as the character set off, 0.1 and 0.4 s before its walk was shown: from 1 cell
// away the server started the fight; from 3, it answered nothing but the walk's confirmation, and the client walked onto
// the group's new cell and attacked again. The server shows the group again and removes it, then destroys the context,
// 28 to 75 ms after the attack, 29 ms halfway; the fight's defender is the group, and its monsters the group's.
message AttackMonsterRequest {
  // No capture sets it.
  AttackOptions options_1 = 1;

  // The group's actor id on the map, negative.
  int64 monster_group_id = 2;
}

// No capture sets it, nor any of its fields.
message AttackOptions {
  optional bool flag_1 = 1;
  string text_2 = 2;
  optional int64 number_3 = 3;
  optional string text_4 = 4;
  optional string text_5 = 5;
  bool flag_6 = 6;
}

// A fight begins: who attacked whom. The server sends it once the fight's map is asked for, after the context of a fight
// is created (D88).
message FightStartingEvent {
  option (d3b.readable.partial) = true;

  // The character: even when a resource's protector attacked it, in both such fights captured.
  int64 attacker_id = 1;

  // The group attacked, as the request named it.
  int64 defender_id = 4;

  FightType type = 6;
}

// The kind of a fight: 4 for every fight captured, monsters the player attacked or a resource's protector.
enum FightType {
  FIGHT_TYPE_VALUE_0 = 0;
  FIGHT_TYPE_VALUE_1 = 1;
  FIGHT_TYPE_VALUE_2 = 2;
  FIGHT_TYPE_VALUE_3 = 3;
  FIGHT_TYPE_MONSTERS = 4;
  FIGHT_TYPE_VALUE_5 = 5;
  FIGHT_TYPE_VALUE_6 = 6;
  FIGHT_TYPE_VALUE_7 = 7;
  FIGHT_TYPE_VALUE_8 = 8;
  FIGHT_TYPE_VALUE_9 = 9;
  FIGHT_TYPE_VALUE_10 = 10;
}

// Joins a fight shown on the character's map, on the side of a fighter of it: the follower, its leader's fight, by a
// click on the fight's sword in the captures (D435). The server answers as when the character attacks: the context
// destroyed and created again for the fight, then the placement.
message FightJoinRequest {
  // No capture sets it.
  Unmeasured unmeasured_1 = 1;

  // The fight, as the party's event and the map name it.
  int32 fight_id = 2;

  // The fighter whose side the character joins: the leader.
  int64 fighter_id = 3;

  message Unmeasured {
    string text_1 = 1;
  }
}

// The character joins the fight's placement.
message FightJoinEvent {
  option (d3b.readable.partial) = true;

  // How long the placement lasts at most, in tenths of a second: 440 to 444 in the captures.
  int64 placement_time = 3;
}

// The cells each team is placed on. A fighter stands on one of its team's from the start, and moves to another by a
// request; the client shows them in red and blue (D125).
message FightPlacementPossiblePositionsEvent {
  option (d3b.readable.partial) = true;

  PlacementCells cells = 1;

  // The character's team: unset, the challenger's, in every fight captured.
  FightTeam team = 2;
}

// The placement cells of both teams. Measured: the attacking character's cells are the second list, every cell the
// player chose among them, and the monsters stood on the first's; the references name them the other way.
message PlacementCells {
  repeated int32 defender_cells = 1;
  repeated int32 challenger_cells = 2;
}

// Moves a fighter to a placement cell: the server answers with every fighter's disposition.
message FightPlacementPositionRequest {
  int32 cell_id = 1;
  int64 fighter_id = 2;
}

// Where fighters stand: during the placement, every fighter's after each move, and as the fight starts.
message EntitiesDispositionEvent {
  option (d3b.readable.partial) = true;

  repeated ActorDisposition dispositions = 2;
}

// Toggles an option of the character's team during the placement: the owner's clicks on the placement's buttons (D203).
message FightOptionToggleRequest {
  FightOption option = 1;
}

// An option of a team's fight, during the placement. Measured (D203, corrected by D216): the owner saw the AI's first
// toggle, 0, refuse spectators, the server answering with text 40, and its second, 2, close the fight, with text 95; the
// server keeps 0 from one fight to the next. The party's, 1, measured on 3.7.14.18 (D435): the server sets it by itself
// as a party's leader attacks, and its follower joined the fight so locked. The other is not measured.
enum FightOption {
  FIGHT_OPTION_NO_SPECTATORS = 0;
  FIGHT_OPTION_PARTY_ONLY = 1;
  FIGHT_OPTION_CLOSED = 2;
  FIGHT_OPTION_VALUE_3 = 3;
}

// A team's option is set, or no longer: the server's answer to each toggle, to every fighter of the fight.
message FightOptionUpdateEvent {
  option (d3b.readable.partial) = true;

  bool enabled = 2;
  FightOption option = 3;
}

// Chooses what the challenges the team wins give, during the placement (D438). Measured on 3.7.14.18 (the owner's three
// fights alone, 2026-11-18): the client sends it by itself 7 to 103 ms after the placement starts, with the choice the
// player made last, even in a fight the player leaves it alone, then again at each of the player's clicks. Its second
// field, a message, was never set: the bot leaves it out.
message ChallengeBonusChoiceRequest {
  ChallengeBonus bonus = 1;
}

// The team's challenges' bonus is set: the server's answer to each choice, 27 to 29 ms after it, with the choice sent.
// Whether a member who does not lead the team is answered, or told of its leader's choice, is not measured.
message ChallengeBonusChoiceSelectedEvent {
  option (d3b.readable.partial) = true;

  ChallengeBonus bonus = 1;
}

// What the challenges won give. Measured: the owner's click on the drops sent 1, on the experience 0, as the
// references name them; the build's enum has these two values alone.
enum ChallengeBonus {
  CHALLENGE_BONUS_EXPERIENCE = 0;
  CHALLENGE_BONUS_DROP = 1;
}

// The fight's challenges (D461), as it starts: sent right after the fight's start. Measured on 3.7.14.18 (83 game
// connections of 2026-11-18 and 19, 2,980 fights): one challenge in every fight, the one the add event named.
message ChallengeListEvent {
  repeated ChallengeInformation challenges = 1;
}

// A challenge of the fight (D461): sent once a fight, 0 to 3 ms before the fight's start, with the challenge the list
// then names; in the 5 fights whose player chose among proposals, the one chosen. Its first field, a list, was never set.
message ChallengeAddEvent {
  option (d3b.readable.partial) = true;

  ChallengeInformation challenge = 2;
}

// A challenge's targets changed (D461): 430 times in the fights measured, each of a challenge the list named, as a turn
// began or a cast ended, with its one target alive and, for 145 of them, the fighter allowed to strike it.
message ChallengeTargetsEvent {
  ChallengeInformation challenge = 1;
}

// A challenge won or lost (D461): once a fight, before the fight's end, of the challenge the list named; 1,329 won and
// 1,647 lost in the fights measured. Its first field, a message, was never set.
message ChallengeResultEvent {
  option (d3b.readable.partial) = true;

  bool success = 2;
  int32 challenge_id = 3;
}

// Asks the server for challenges to choose from, during the placement (D461): sent 4 times in the fights measured, at
// the player's click, each answered by the proposals. Its two fields were never set.
message ChallengeProposalRequest {
}

// The challenges the player may choose from, the server's answer to the request (D461): two in each of its 5 times, 4
// of them right after the request, the other with none before it in its capture. Its third field, a number, was always
// set, its meaning not measured.
message ChallengeProposalEvent {
  option (d3b.readable.partial) = true;

  repeated ChallengeInformation proposals = 4;
}

// Chooses one of the challenges proposed (D461): sent once after each of the 5 proposals, naming one of them, which the
// add event then named.
message ChallengeSelectionRequest {
  int32 challenge_id = 1;
}

// A challenge, as the server describes it (D461). Measured: its state was the running one everywhere, the result coming
// apart; the two bonuses, 45 to 130, were equal in every fight; its sixth field, an enum, was never set.
message ChallengeInformation {
  option (d3b.readable.partial) = true;

  ChallengeState state = 1;
  int32 challenge_id = 2;
  int32 bonus = 3;
  repeated ChallengeTarget targets = 5;
}

// Where a challenge stands. Measured: 2 in every challenge the server described; the other two values not seen.
enum ChallengeState {
  CHALLENGE_STATE_VALUE_0 = 0;
  CHALLENGE_STATE_VALUE_1 = 1;
  CHALLENGE_STATE_RUNNING = 2;
}

// A challenge's target (D461). Measured: 955 of the 959 targets with an id were fighters of the fight's turns, each with
// its cell; 123 had neither, and a negative cell; the fighters allowed to strike it were fighters of the fight. Its third and
// fourth fields were never set.
message ChallengeTarget {
  option (d3b.readable.partial) = true;

  int64 fighter_id = 1;
  repeated int64 attacker_ids = 2;
  int32 cell_id = 5;
}

// The character is ready to fight, or no longer: the fight starts once every character is.
message FightReadyRequest {
  bool ready = 1;

  // No capture sets it.
  bool flag_2 = 2;
}

// A character in the fight said it is ready, or no longer.
message FightHumanReadyStateEvent {
  option (d3b.readable.partial) = true;

  int64 character_id = 2;
  bool ready = 3;
}

// The placement is over and the fight starts.
message FightStartEvent {
}

// A fighter comes into the fight: each fighter as the placement starts.
message FightFighterShowEvent {
  option (d3b.readable.partial) = true;

  Actor fighter = 1;
}

// Every fighter, as the fight starts.
message FightSynchronizeEvent {
  repeated Actor fighters = 1;
}

// The order the fighters play in, each with whether it died: sent as the placement starts, then after each death.
message FightTurnListEvent {
  repeated FightTurnEntry entries = 1;
}

// A fighter in the turns' order.
message FightTurnEntry {
  option (d3b.readable.partial) = true;

  oneof kind {
    FightTurnFighter fighter = 2;
  }
}

// A fighter in the turns' order, by id.
message FightTurnFighter {
  option (d3b.readable.partial) = true;

  int64 fighter_id = 1;

  // Set once the fighter died, which stays in the order.
  bool dead = 2;
}

// A new round of turns begins, the first as the fight starts.
message FightNewRoundEvent {
  option (d3b.readable.partial) = true;

  int32 round = 1;
}

// A fighter's turn begins.
message FightTurnEvent {
  option (d3b.readable.partial) = true;

  // How long the turn lasts, in tenths of a second: 300 and 340 for the two characters captured, 290 for a monster, 150
  // for a summon, 10 for a dead fighter, whose turn passes at once.
  int32 duration = 2;

  int64 fighter_id = 3;
  int32 round = 7;
}

// The character's turn begins and it may act: sent to its client alone, after FightTurnEvent.
message FightTurnStartPlayingEvent {
}

// The server waits for the client to show a fighter's turn ending: the client answers FightTurnReadyRequest once the
// sequences before are acknowledged.
message FightIsTurnReadyEvent {
  option (d3b.readable.partial) = true;

  int64 fighter_id = 2;
}

// The client is ready for the next turn: always ready in the 49 the captures hold, 3 ms to 3.5 s after the server asked,
// 0.6 s halfway, once it showed what came before.
message FightTurnReadyRequest {
  bool ready = 1;

  // No capture sets it.
  Value value_2 = 2;

  enum Value {
    VALUE_VALUE_0 = 0;
    VALUE_VALUE_1 = 1;
  }
}

// A fighter's turn is over.
message FightTurnEndEvent {
  option (d3b.readable.partial) = true;

  int64 fighter_id = 2;
}

// Ends the character's turn before its time: the player's click, D3B's, or the client's own (D252).
message FightTurnFinishRequest {
  // Set when the client ends the turn by itself, in its inactive state, which passes the character's turns until the
  // player clicks its OK (D366): 4 in a friend's capture, 21 in 5 of the owner's 89 fights the AI played, never in a
  // fight played by hand nor in an end D3B sent. Withheld from the server while the AI plays (D367).
  bool automatic = 1;
}

// A fighter's characteristics changed: after a cast or a step, the AP or MP left; as a turn begins, those it starts with.
message FightRefreshCharacterStatsEvent {
  FightCharacteristics stats = 1;
  int64 fighter_id = 2;
}

// The fight is over: each fighter's outcome, and what the character gained.
message FightEndEvent {
  option (d3b.readable.partial) = true;

  repeated FightResult results = 4;
}

// A fighter's outcome.
message FightResult {
  option (d3b.readable.partial) = true;

  FightOutcome outcome = 1;
  FightResultFighter fighter = 2;
  FightLoot loot = 3;
}

// How a fight ended for a fighter: of the 11 fights captured, the character won 8, the monsters losing, and lost 3, the
// monsters winning.
enum FightOutcome {
  FIGHT_OUTCOME_LOST = 0;
  FIGHT_OUTCOME_VALUE_1 = 1;
  FIGHT_OUTCOME_WON = 2;
  FIGHT_OUTCOME_VALUE_3 = 3;
  FIGHT_OUTCOME_VALUE_4 = 4;
}

// Whose outcome it is.
message FightResultFighter {
  option (d3b.readable.partial) = true;

  bool alive = 2;
  int64 fighter_id = 5;

  oneof kind {
    FightResultCharacter character = 3;
  }
}

// A character's outcome: its level and experience.
message FightResultCharacter {
  repeated FightResultData data = 1;
  int32 level = 2;
}

// Something a character's outcome holds.
message FightResultData {
  option (d3b.readable.partial) = true;

  oneof kind {
    FightExperience experience = 1;
  }
}

// The character's experience after the fight. Measured: the experience now lies between the level's floor and the next
// level's, which are the client's table's for its level; what the fight gave is apart. The references name them otherwise.
message FightExperience {
  option (d3b.readable.partial) = true;

  int64 experience = 3;
  int64 level_floor = 4;
  int64 next_level_floor = 6;
  int64 gained = 8;
}

// What a fighter gained: objects and kamas.
message FightLoot {
  repeated FightLootObjects objects = 1;
  int64 kamas = 2;
}

// Objects a fighter gained, from one monster or more.
message FightLootObjects {
  option (d3b.readable.partial) = true;

  repeated FightLootObject objects = 3;

  // The monster the objects came from, by its id in the client's table, as the fight's fighters name it.
  int32 monster_id = 4;
}

// An object gained.
message FightLootObject {
  option (d3b.readable.partial) = true;

  int32 quantity = 1;

  // The item's id in the client's table.
  int32 item_id = 3;
}

// A fighter's spells' cooldowns, sent to the character's client for the character and its summons. Measured (D193): a
// spell's count goes down as each of its caster's turns ends, as 197 of the 213 counts of spells cast said; 16 were
// one lower, sent as the turn ended.
message RefreshCooldownEvent {
  option (d3b.readable.partial) = true;

  int64 fighter_id = 2;
  repeated FightSpellCooldown cooldowns = 4;
}

// How many rounds a spell waits before it may be cast again: 0 once it may.
message FightSpellCooldown {
  option (d3b.readable.partial) = true;

  int32 rounds = 2;
  int32 spell_id = 3;
}

// The bank: once the banker's reply is chosen, an exchange with the character's storage opens, holding its objects and
// kamas; the character moves objects and kamas into it or out of it, then leaves.
syntax = "proto3";

package d3b.game;

import "Game/inventory.proto";
import "Game/npcs.proto";
import "Readable/options.proto";

option csharp_namespace = "D3B.Protocol.Game";

// An exchange with a storage opened, as the bank's does.
message ExchangeStartedWithStorageEvent {
  option (d3b.readable.partial) = true;

  ExchangeType type = 1;

  // The most stacks the storage holds: the largest int32 for the bank, in the captures.
  int32 max_slots = 2;
}

// What kind of exchange opened. Twenty-three values in this build: 15 opened the bank, in the captures; the others are
// not measured.
enum ExchangeType {
  EXCHANGE_TYPE_VALUE_0 = 0;
  EXCHANGE_TYPE_VALUE_1 = 1;
  EXCHANGE_TYPE_VALUE_2 = 2;
  EXCHANGE_TYPE_VALUE_3 = 3;
  EXCHANGE_TYPE_VALUE_4 = 4;
  EXCHANGE_TYPE_VALUE_5 = 5;
  EXCHANGE_TYPE_VALUE_6 = 6;
  EXCHANGE_TYPE_VALUE_7 = 7;
  EXCHANGE_TYPE_VALUE_8 = 8;
  EXCHANGE_TYPE_VALUE_9 = 9;
  EXCHANGE_TYPE_VALUE_10 = 10;
  EXCHANGE_TYPE_VALUE_11 = 11;
  EXCHANGE_TYPE_VALUE_12 = 12;
  EXCHANGE_TYPE_VALUE_13 = 13;
  EXCHANGE_TYPE_VALUE_14 = 14;
  EXCHANGE_TYPE_STORAGE = 15;
  EXCHANGE_TYPE_VALUE_16 = 16;
  EXCHANGE_TYPE_VALUE_17 = 17;
  EXCHANGE_TYPE_VALUE_18 = 18;
  EXCHANGE_TYPE_VALUE_19 = 19;
  EXCHANGE_TYPE_VALUE_20 = 20;
  EXCHANGE_TYPE_VALUE_21 = 21;
  EXCHANGE_TYPE_VALUE_22 = 22;
}

// What the storage holds, sent as it opens.
message StorageContentEvent {
  option (d3b.readable.partial) = true;

  int64 kamas = 1;
  repeated InventoryObject objects = 2;
}

// Moves stacks of the inventory into the storage, whole. The server takes those it may and answers with the inventory's
// stacks deleted, those of the storage changed and the weight; it leaves the others, such as a quest's objects or a stack
// the inventory lacks, and answers nothing when it takes none, or outside the storage's exchange.
message ExchangeTransferFromInventoryRequest {
  repeated int32 uids = 1;
}

// Moves kamas between the inventory and the storage: positive into the storage, negative out of it, as the captures
// took them out. The server answers nothing to none, to more than the side they leave holds, or outside the storage's
// exchange.
message ExchangeKamasRequest {
  int64 quantity = 1;

  // No capture sets this field, nor the next two.
  Value value_2 = 2;

  int64 number_3 = 3;
  Unmeasured message_4 = 4;

  enum Value {
    VALUE_VALUE_0 = 0;
    VALUE_VALUE_1 = 1;
    VALUE_VALUE_2 = 2;
    VALUE_VALUE_3 = 3;
    VALUE_VALUE_4 = 4;
    VALUE_VALUE_5 = 5;
    VALUE_VALUE_6 = 6;
    VALUE_VALUE_7 = 7;
    VALUE_VALUE_8 = 8;
  }

  message Unmeasured {
    repeated int64 numbers_1 = 1;
    optional bool flag_2 = 2;
    int64 number_3 = 3;
    repeated bool flags_4 = 4;
    optional string text_5 = 5;
    string text_6 = 6;
  }
}

// Stacks of the storage changed, as when objects are put in it: each stack as it now is.
message StorageObjectsUpdateEvent {
  option (d3b.readable.partial) = true;

  repeated InventoryObject objects = 1;
}

// The kamas the storage holds now.
message StorageKamasUpdateEvent {
  int64 kamas = 1;
}

// Leaves the dialog the character is in: the server ends the NPC's with DialogLeaveEvent and the bank's exchange with
// ExchangeLeaveEvent, and answers nothing outside a dialog. The client sends two of these by itself once the server ended
// an exchange it did not ask to leave, as when D3B left it.
message DialogLeaveRequest {
  // Three values in this build; no capture sets it.
  Value value_1 = 1;

  enum Value {
    VALUE_VALUE_0 = 0;
    VALUE_VALUE_1 = 1;
    VALUE_VALUE_2 = 2;
  }
}

// The exchange is over, as the bank's once the character left it.
message ExchangeLeaveEvent {
  option (d3b.readable.partial) = true;

  DialogType type = 1;
}

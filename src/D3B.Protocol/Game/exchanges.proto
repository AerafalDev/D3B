// The bank: once the banker's reply is chosen, an exchange with the character's storage opens, holding its objects and
// kamas; the character moves objects and kamas into it or out of it, then leaves. The guild's chest: its element used, an
// exchange with the guild's storage opens, holding its objects; the character moves them a stack at a time, then leaves.
syntax = "proto3";

package d3b.game;

import "Game/inventory.proto";
import "Game/npcs.proto";
import "Readable/options.proto";

option csharp_namespace = "D3B.Protocol.Game";

// An exchange with a storage opened, as the bank's does.
message ExchangeStartedWithStorageEvent {
  option (d3b.readable.partial) = true;

  ExchangeType type = 1;

  // The most stacks the storage holds: the largest int32 for the bank, in the captures.
  int32 max_slots = 2;
}

// What kind of exchange opened. Twenty-three values in this build: 15 opened the bank, 21 the guild's chest and 1 an
// exchange between two characters, in the captures; the others are not measured.
enum ExchangeType {
  EXCHANGE_TYPE_VALUE_0 = 0;
  EXCHANGE_TYPE_PLAYER = 1;
  EXCHANGE_TYPE_VALUE_2 = 2;
  EXCHANGE_TYPE_VALUE_3 = 3;
  EXCHANGE_TYPE_VALUE_4 = 4;
  EXCHANGE_TYPE_VALUE_5 = 5;
  EXCHANGE_TYPE_VALUE_6 = 6;
  EXCHANGE_TYPE_VALUE_7 = 7;
  EXCHANGE_TYPE_VALUE_8 = 8;
  EXCHANGE_TYPE_VALUE_9 = 9;
  EXCHANGE_TYPE_VALUE_10 = 10;
  EXCHANGE_TYPE_VALUE_11 = 11;
  EXCHANGE_TYPE_VALUE_12 = 12;
  EXCHANGE_TYPE_VALUE_13 = 13;
  EXCHANGE_TYPE_VALUE_14 = 14;
  EXCHANGE_TYPE_STORAGE = 15;
  EXCHANGE_TYPE_VALUE_16 = 16;
  EXCHANGE_TYPE_VALUE_17 = 17;
  EXCHANGE_TYPE_VALUE_18 = 18;
  EXCHANGE_TYPE_VALUE_19 = 19;
  EXCHANGE_TYPE_VALUE_20 = 20;
  EXCHANGE_TYPE_GUILD_CHEST = 21;
  EXCHANGE_TYPE_VALUE_22 = 22;
}

// What the storage holds, sent as it opens: the bank's and the guild's chest's, which sets no kamas.
message StorageContentEvent {
  option (d3b.readable.partial) = true;

  int64 kamas = 1;
  repeated InventoryObject objects = 2;
}

// Moves stacks of the inventory into the storage, whole. The server takes those it may and answers with the inventory's
// stacks deleted, those of the storage changed and the weight; it leaves the others, such as a quest's objects or a stack
// the inventory lacks, and answers nothing when it takes none. In an exchange with another character it moves them into
// the exchange: measured on the owner's captures of 2026-11-21 (D482), 31 requests each answered 28 to 169 ms later by
// one ExchangeObjectsAddedEvent listing up to 33 stacks.
message ExchangeTransferFromInventoryRequest {
  repeated int32 uids = 1;
}

// Moves stacks of the storage into the inventory, whole: the bank's list take, measured on the owner's captures of 20 to 26
// November on the client 3.7.14.18 (D580), 70 requests of 1 to 169 ids, the client never sending it in the guild's chest. The
// server answers 28 ms later, in one millisecond, with the storage's stacks removed (StorageObjectsRemovedEvent), the
// inventory's added, each keeping its id and never joined to a stack of the same item (ObjectsAddedEvent), then the weight.
// When the pods cannot hold them all, it takes stacks whole while they fit, then of one more stack what they hold, which
// stays in the storage with its new quantity (StorageObjectUpdateEvent) and comes in as a new stack, and says so with text
// 266. It moves nothing, saying why, when the inventory can take none (text 267), or when the last bank action was asked
// less than about a quarter of a second before (text 268).
message ExchangeTransferToInventoryRequest {
  repeated int32 uids = 1;
}

// Moves every stack of the storage into the inventory: the bank's take of everything, 27 requests in the same captures,
// answered as a list naming every stack.
message ExchangeTransferAllToInventoryRequest {
  // No capture sets it.
  ExchangeTransferKind kind = 1;
}

// What the take of everything moves. Seven values in this build; none is measured, the client sending the first.
enum ExchangeTransferKind {
  EXCHANGE_TRANSFER_KIND_VALUE_0 = 0;
  EXCHANGE_TRANSFER_KIND_VALUE_1 = 1;
  EXCHANGE_TRANSFER_KIND_VALUE_2 = 2;
  EXCHANGE_TRANSFER_KIND_VALUE_3 = 3;
  EXCHANGE_TRANSFER_KIND_VALUE_4 = 4;
  EXCHANGE_TRANSFER_KIND_VALUE_5 = 5;
  EXCHANGE_TRANSFER_KIND_VALUE_6 = 6;
}

// Moves kamas between the inventory and the storage: positive into the storage, negative out of it, as the captures
// took them out. The server answers nothing to none, to more than the side they leave holds, or outside the storage's
// exchange.
message ExchangeKamasRequest {
  int64 quantity = 1;

  // No capture sets this field, nor the next two.
  Value value_2 = 2;

  int64 number_3 = 3;
  Unmeasured message_4 = 4;

  enum Value {
    VALUE_VALUE_0 = 0;
    VALUE_VALUE_1 = 1;
    VALUE_VALUE_2 = 2;
    VALUE_VALUE_3 = 3;
    VALUE_VALUE_4 = 4;
    VALUE_VALUE_5 = 5;
    VALUE_VALUE_6 = 6;
    VALUE_VALUE_7 = 7;
    VALUE_VALUE_8 = 8;
  }

  message Unmeasured {
    repeated int64 numbers_1 = 1;
    optional bool flag_2 = 2;
    int64 number_3 = 3;
    repeated bool flags_4 = 4;
    optional string text_5 = 5;
    string text_6 = 6;
  }
}

// Stacks of the storage changed, as when objects are put in it: each stack as it now is.
message StorageObjectsUpdateEvent {
  option (d3b.readable.partial) = true;

  repeated InventoryObject objects = 1;
}

// The kamas the storage holds now.
message StorageKamasUpdateEvent {
  int64 kamas = 1;
}

// Leaves the dialog the character is in: the server ends the NPC's with DialogLeaveEvent and the bank's exchange with
// ExchangeLeaveEvent, and answers nothing outside a dialog. The client sends two of these by itself once the server ended
// an exchange it did not ask to leave, as when D3B left it.
message DialogLeaveRequest {
  // Three values in this build; no capture sets it.
  Value value_1 = 1;

  enum Value {
    VALUE_VALUE_0 = 0;
    VALUE_VALUE_1 = 1;
    VALUE_VALUE_2 = 2;
  }
}

// The exchange is over, as the bank's or the guild's chest's once the character left it.
message ExchangeLeaveEvent {
  option (d3b.readable.partial) = true;

  DialogType type = 1;
}

// An exchange with a storage of tabs opened, as the guild's chest's does when its element is used: then what the open tab
// holds, StorageContentEvent. The tabs themselves are not measured: the guild captured had one.
message ExchangeStartedWithTabbedStorageEvent {
  option (d3b.readable.partial) = true;

  ExchangeType type = 1;
}

// Moves a stack, or part of it, between the inventory and the open storage: a quantity of the inventory's stack into the
// storage, positive, or of the storage's stack out of it, negative, each stack named by its own uid. Measured on the guild's
// chest: the server answers 28 ms later with the storage's stack, the inventory's stack, added to, changed or deleted, and
// the weight; it refuses an object bound to the account with a text of the error kind, and moves nothing.
message ExchangeObjectMoveRequest {
  int32 uid = 1;

  // No capture sets it.
  repeated bool flags_2 = 2;

  int32 quantity = 3;
}

// A stack of the storage changed, alone, as when a quantity is moved into or out of the guild's chest: the stack as it now
// is.
message StorageObjectUpdateEvent {
  InventoryObject object = 1;
}

// A stack gone from the storage, as when the character took the guild chest's stack back whole.
message StorageObjectRemovedEvent {
  option (d3b.readable.partial) = true;

  int32 uid = 1;
}

// Stacks gone from the storage, whole, as a list take out of the bank removes them.
message StorageObjectsRemovedEvent {
  option (d3b.readable.partial) = true;

  repeated int32 uids = 2;
}

// Asks a character of the map for an exchange: the follower its leader, in the captures (D435). The server tells both of
// the request, and opens the exchange once the other accepts.
message ExchangePlayerRequest {
  int64 target_id = 1;
}

// A character asked another for an exchange: to both, 27 ms after the request.
message ExchangeRequestedEvent {
  ExchangeType type = 1;

  // Who asks.
  int64 source_id = 2;

  // Who is asked.
  int64 target_id = 3;
}

// Accepts the exchange another character asked for.
message ExchangeAcceptRequest {
}

// An exchange with another character opened, to both, as the one asked accepts.
message ExchangeStartedWithPlayerEvent {
  option (d3b.readable.partial) = true;

  ExchangeType type = 3;
}

// Objects went into the exchange between two characters: to both, 28 ms after each move of one side's, one event a move.
// Measured on 3.7.14.18 (D442): three moves, two by ExchangeObjectMoveRequest and one by
// ExchangeTransferFromInventoryRequest, three events to each side; each lists the stacks moved, which no step reads yet.
// A transfer of many stacks makes one event listing them all, an object and a number each (D482).
message ExchangeObjectsAddedEvent {
  option (d3b.readable.partial) = true;
}

// Says the character is ready to conclude the exchange with another character, or no longer. Each side's objects come
// through the requests the bank's exchange uses; the exchange concludes once both are ready, the objects moved and the
// exchange left in the same millisecond.
message ExchangeReadyRequest {
  // The exchange's step: 3 for both characters, the one exchange captured, as many as the exchange's changes the
  // server told each (ExchangeObjectsAddedEvent), the lead's reading of it (D442).
  int32 step = 1;

  bool ready = 2;
}

// A character of the exchange is ready, or no longer: to both.
message ExchangeReadyEvent {
  bool ready = 1;
  int64 character_id = 2;
}

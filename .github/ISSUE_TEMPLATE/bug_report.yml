name: Bug report
description: Something in D3B does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Never attach a capture of the game connection or a log showing a login ticket: describe them instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what D3B did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start D3B, then Dofus.
        2. Choose a character.
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: D3B version
      placeholder: "0.10.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - Windows x64
        - Windows ARM64
        - macOS Apple Silicon
        - macOS Intel
        - Linux x64
        - Linux ARM64
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Client build
      description: Shown in D3B's status bar.
      placeholder: "3.7.13.17"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines of D3B's log, with any ticket or account name removed.
      render: text

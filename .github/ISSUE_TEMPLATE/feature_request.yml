name: Feature request
description: An idea for D3B.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Requests for what D3B never does (evading detection, mass accounts, payment automation, bypassing Ankama Shield) are closed.
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The problem or the goal, as a player, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How D3B could help
      description: What you imagine, and what you would see in the app.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead

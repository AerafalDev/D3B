name: AppImage

on:
  pull_request:
    paths:
      - .github/workflows/appimage.yml
      - .github/workflows/release.yml
      - scripts/notices*.ts
      - scripts/appimage-notices*.ts
      - scripts/appimage-runtime*.ts
      - src-tauri/tauri*.json
      - src-tauri/Cargo.lock
      - package.json
      - bun.lock

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: AppImage notices (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: ARM64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The runner's image
        id: image
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cached packages of Tauri's system libraries
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: tauri-apt-${{ runner.arch }}-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}
          restore-keys: tauri-apt-${{ runner.arch }}-${{ steps.image.outputs.os }}-
      - name: System libraries for Tauri
        timeout-minutes: 5
        env:
          PACKAGES: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils
        run: |
          debs="$HOME/apt-debs"
          if compgen -G "$debs/*.deb" >/dev/null \
            && sudo dpkg -i --refuse-downgrade --skip-same-version "$debs"/*.deb \
            && dpkg -s $PACKAGES >/dev/null; then
            echo "Installed from the cache"
            exit 0
          fi
          mkdir -p "$debs/partial"
          sudo apt-get update
          sudo apt-get install -y --fix-broken -o Dir::Cache::archives="$debs" $PACKAGES
          sudo apt-get autoclean -o Dir::Cache::archives="$debs"
          sudo rm -f "$debs/lock"
          sudo chown -R "$USER" "$debs"
      - name: Cache the packages of Tauri's system libraries
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: appimage-${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - name: Cached cargo-about
        id: cargo-about
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-0.9.3-ubuntu-22.04-${{ runner.arch }}
      - name: cargo-about, for the third-party notices
        if: steps.cargo-about.outputs.cache-hit != 'true'
        run: cargo install cargo-about@0.9.3 --locked --features cli
      - name: The AppImage's system libraries, read from a first build
        run: bun scripts/appimage-notices.ts "$TARGET"
      - name: The AppImage, built as the release builds it
        run: |
          bun tauri build --target "$TARGET" --bundles appimage --config src-tauri/tauri.release.conf.json \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: The AppImage carries the notices
        run: |
          image="$(realpath src-tauri/target/"$TARGET"/release/bundle/appimage/*.AppImage)"
          notices="$(realpath src-tauri/gen/SYSTEM-LIBRARIES-NOTICES.txt)"
          mkdir "$RUNNER_TEMP/extracted"
          cd "$RUNNER_TEMP/extracted"
          "$image" --appimage-extract > /dev/null
          packed=squashfs-root/usr/lib/D3B
          cmp "$packed/SYSTEM-LIBRARIES-NOTICES.txt" "$notices"
          grep -q "SYSTEM-LIBRARIES-NOTICES.txt beside this file" "$packed/THIRD-PARTY-NOTICES.txt"
          grep -q "^# The AppImage's runtime and AppRun$" "$notices"
          runtime="$("$image" --appimage-version 2>&1 | grep -o 'type2-runtime/commit/[0-9a-f]*')"
          grep -qF "type2-runtime ${runtime##*/} (MIT): " "$notices"
          {
            echo "## $(basename "$image")"
            echo
            echo "\`usr/lib/D3B/SYSTEM-LIBRARIES-NOTICES.txt\`: $(wc -c < "$notices") bytes," \
              "$(grep -cE '^[^ #].* \(source [^)]+\)$' "$notices") packages, $(grep -c '^  apt-get source ' "$notices") source packages."
            echo
            echo '```'
            sed -n '1,8p' "$notices"
            echo '```'
            echo
            echo '```'
            sed -n "/^# The AppImage's runtime and AppRun$/,/^## /p" "$notices" | sed '$d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [next, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The runner's image
        id: image
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cached packages of Tauri's system libraries
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: tauri-apt-${{ runner.arch }}-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}
          restore-keys: tauri-apt-${{ runner.arch }}-${{ steps.image.outputs.os }}-
      - name: System libraries for Tauri
        timeout-minutes: 5
        env:
          PACKAGES: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
        run: |
          debs="$HOME/apt-debs"
          if compgen -G "$debs/*.deb" >/dev/null \
            && sudo dpkg -i --refuse-downgrade --skip-same-version "$debs"/*.deb \
            && dpkg -s $PACKAGES >/dev/null; then
            echo "Installed from the cache"
            exit 0
          fi
          mkdir -p "$debs/partial"
          sudo apt-get update
          sudo apt-get install -y --fix-broken -o Dir::Cache::archives="$debs" $PACKAGES
          sudo apt-get autoclean -o Dir::Cache::archives="$debs"
          sudo rm -f "$debs/lock"
          sudo chown -R "$USER" "$debs"
      - name: Cache the packages of Tauri's system libraries
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run typecheck
      - run: bun run test
      - run: bun run rules
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Bindings are current
        run: git diff --exit-code -- src/bindings.ts
      - name: Cached cargo-about
        id: cargo-about
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-0.9.3-${{ runner.os }}-${{ runner.arch }}
      - name: cargo-about
        if: steps.cargo-about.outputs.cache-hit != 'true'
        run: cargo install cargo-about@0.9.3 --locked --features cli
      - name: Third-party notices for the six targets
        run: |
          bun run build
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc x86_64-apple-darwin aarch64-apple-darwin \
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            bun scripts/notices.ts "$target"
          done
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: tools/extractor/global.json
      - name: Extractor's format
        working-directory: tools/extractor
        run: dotnet format --verify-no-changes
      - name: Extractor's tests
        working-directory: tools/extractor
        run: dotnet test

  pull-request:
    name: Pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Size
        if: ${{ !startsWith(github.head_ref, 'release-please--') && !contains(github.event.pull_request.labels.*.name, 'size-exception') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/check-pr-size.ts "origin/$BASE_REF"

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (win-x64)
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Build the inspection tool
        run: dotnet build scripts/inspect.cs

      - name: Build the extraction tool
        run: dotnet build scripts/extract.cs

      - name: Build the release tool
        run: dotnet build scripts/release.cs

      - name: Build the client tool
        run: dotnet build scripts/client.cs

      - name: Build the capture tool
        run: dotnet build scripts/capture.cs

      - name: Build the schema tool
        run: dotnet build scripts/schema.cs

      - name: Build the mapping tool
        run: dotnet build scripts/mapping.cs

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --no-build --results-directory TestResults --report-xunit-trx

      - name: Check the plugin template
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $work = Join-Path $env:RUNNER_TEMP 'template-check'
          dotnet pack src/D3B.Core/D3B.Core.csproj --configuration Release --output "$work/feed" -p:MinVerVersionOverride=0.0.0-template
          dotnet new nugetconfig --output $work
          dotnet nuget add source "$work/feed" --name template-check --configfile "$work/nuget.config"
          dotnet new install templates/d3b-plugin --debug:custom-hive "$work/hive"
          dotnet new d3b-plugin --name TemplatePlugin --output "$work/TemplatePlugin" --d3b-version 0.0.0-template --plugins-directory "$work/plugins" --debug:custom-hive "$work/hive"
          dotnet build "$work/TemplatePlugin"
          if (-not (Test-Path "$work/plugins/TemplatePlugin/TemplatePlugin.dll")) { throw 'The plugin built from the template was not deployed.' }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

name: Release

on:
  push:
    branches: [next]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: next
          config-file: .github/release-config.json
          manifest-file: .github/release-manifest.json

  build:
    name: Build ${{ matrix.name }}
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Windows ARM64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macOS x64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: macOS ARM64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Rust toolchain and target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - name: Game data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build="$(jq -r '.build // empty' .github/game-data.json)"
          if [ -n "$build" ]; then
            bun scripts/fetch-data.ts "$build"
          else
            echo "::warning::.github/game-data.json names no client build: this release ships without game data."
          fi
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release-please.outputs.tag }}
          projectPath: .
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true

  channel:
    name: Update channel
    needs: [release-please, build]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish latest.json on the next channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern latest.json --dir channel
          for platform in windows-x86_64 windows-aarch64 darwin-x86_64 darwin-aarch64 linux-x86_64 linux-aarch64; do
            jq -e --arg p "$platform" '.platforms[$p]' channel/latest.json > /dev/null || { echo "::error::latest.json has no $platform"; exit 1; }
          done
          if ! gh release view updater-next > /dev/null 2>&1; then
            gh release create updater-next --target next --prerelease --title "Update channel: next" --notes "The updater's manifest for the rewrite's pre-releases. Do not download from here."
          fi
          gh release upload updater-next channel/latest.json --clobber

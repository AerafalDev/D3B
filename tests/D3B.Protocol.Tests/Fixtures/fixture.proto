// A small protocol of our own, for the matcher's cases the readable protocol has none of: messages no field reaches,
// alike in shape.
syntax = "proto3";

package d3b.fixture;

option csharp_namespace = "D3B.Protocol.Tests.Fixtures";

message Root {
  oneof content {
    Left left = 1;
    Right right = 2;
  }

  oneof extra {
    string note = 3;
    int32 count = 4;
  }
}

message Left {
  string name = 1;
  Color color = 2;
}

message Right {
  repeated int32 numbers = 1;
  optional int64 total = 2;
}

message LoneFirst {
}

message LoneSecond {
}

enum Color {
  COLOR_RED = 0;
  COLOR_GREEN = 1;
  COLOR_BLUE = 2;
}

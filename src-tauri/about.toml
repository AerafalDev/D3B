# The licences cargo-about may pick for the crates in the app's binary, in order of preference when a crate offers
# a choice (scripts/notices.ts). A crate under a licence missing here fails the notices, so a new one is a decision.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "MIT-0",
    "Unlicense",
    "BSL-1.0",
]

# D3B itself (publish = false) is not third-party.
[private]
ignore = true

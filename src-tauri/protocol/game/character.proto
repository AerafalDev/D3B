// The character played, its context, characteristics, life and weight: the live view's messages (docs/protocol.md,
// "Decoding"). Readable names and meanings are the C# version's (inferred, `main:src/D3B.Protocol/Game/` and
// `main:docs/client-game.md`); field numbers and kinds were checked by hand against 3.7.13.17's schema (the
// extractor's, 2026-11-12), which the pins' audit test checks. A message marked partial declares only the fields
// D3B reads.
syntax = "proto3";

package d3b.game;

// The answer to the character chosen.
message CharacterSelectionEvent {
  oneof result {
    Success success = 1;
    Failure failure = 2;
  }

  // Partial.
  message Success {
    Character character = 1;
  }

  message Failure {}
}

// A character of the account. Partial.
message Character {
  int64 id = 3;
  // In a oneof of the schema with field 2, which D3B does not read.
  CharacterBasics basics = 4;
}

// Partial.
message CharacterBasics {
  optional int32 level = 3;
  string name = 6;
  // In a oneof of the schema with fields 1 and 2, which D3B does not read.
  CharacterLook look = 5;
}

// Partial.
message CharacterLook {
  int32 breed_id = 3;
}

// The character enters roleplay or a fight.
message ContextCreationEvent {
  GameContext context = 1;

  enum GameContext {
    GAME_CONTEXT_ROLEPLAY = 0;
    GAME_CONTEXT_FIGHT = 1;
  }
}

// The character leaves its context; the next one is created after it (inferred, the C# version).
message ContextDestroyEvent {}

// The character's characteristics. Partial.
message CharacterStatsEvent {
  CharacterStats stats = 1;
}

// Partial. The experience's three fields come in the order level_experience < experience < next_level_experience
// (verified on 2,988 frames); what each means is inferred from that order.
message CharacterStats {
  repeated Characteristic characteristics = 1;
  int64 next_level_experience = 2;
  int64 kamas = 6;
  int64 level_experience = 8;
  int64 experience = 11;
}

// One characteristic: its id and its value, of one of three kinds, the sum of its numbers (verified on the life:
// `artifacts/studies/live-view.md`). Partial.
message Characteristic {
  int32 id = 2;
  oneof kind {
    UsableCharacteristic usable = 1;
    CharacteristicValue value = 3;
    DetailedCharacteristic detailed = 5;
  }
}

// Action and movement points: the base in number 4 (verified), the other numbers' meanings not measured.
message UsableCharacteristic {
  int32 number_1 = 1;
  int32 number_2 = 2;
  int32 number_3 = 3;
  int32 number_4 = 4;
  int32 number_5 = 5;
  int32 number_6 = 6;
  int32 spent = 7;
}

message CharacteristicValue {
  int32 number_1 = 1;
  int64 total = 2;
}

// Numbers from several sources, whose meanings are not measured. Partial: field 6, an enum, is not a number.
message DetailedCharacteristic {
  int32 number_1 = 1;
  int32 number_2 = 2;
  int32 number_3 = 3;
  int32 number_4 = 4;
  int32 number_5 = 5;
  int32 number_7 = 7;
}

// The character gains a level (verified, 36 of 36 level-ups). Partial.
message CharacterLevelUpEvent {
  int32 level = 1;
}

// The character starts regaining life, every `interval` tenths of a second (inferred, the C# version). Partial.
message LifeRegenStartEvent {
  int32 interval = 1;
}

// The character stops regaining life. Partial.
message LifeRegenEndEvent {
  int32 max_life = 1;
  int32 life = 3;
  optional int32 regenerated = 4;
}

// The kamas the character carries now (verified: the next characteristics' kamas equal it, 480 of 480). Partial: field
// 1, a map never set, is not declared.
message KamasUpdateEvent {
  int64 kamas = 2;
}

// What the character carries against what it can.
message InventoryWeightEvent {
  int32 weight = 1;
  int32 max_weight = 2;
}
